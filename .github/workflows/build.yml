name: Build private release candidates
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project
        type: choice
        options: [skills, shiftmochi, got-that, outreach, ttpos-cli, ttpos-lite]
        required: true
      sha:
        description: Exact approved commit (required with pr; otherwise empty selects main)
        type: string
      pr:
        description: Reviewed same-repository PR number (empty builds main)
        type: string
      diagnostic_test:
        description: Verify private failure diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ inputs.project }}-${{ inputs.sha || github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: private-build
    env:
      PROJECT: ${{ inputs.project }}
      EXPECTED_SHA: ${{ inputs.sha }}
      PR_NUMBER: ${{ inputs.pr }}
      PROBE: ${{ inputs.diagnostic_test }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          token: ${{ github.token }}
      - name: Validate request
        id: request
        run: |
          # Project key -> private repository, its release branch and the build directory inside it.
          case "$PROJECT" in
            skills|shiftmochi|got-that|outreach|ttpos-lite) repo=$PROJECT branch=main subdir= ;;
            ttpos-cli) repo=ttpos-server-go branch=release subdir=ttpos-cli ;;
            *) exit 1 ;;
          esac
          printf 'repo=%s\nbranch=%s\nsubdir=%s\n' "$repo" "$branch" "$subdir" >> "$GITHUB_OUTPUT"
          [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Record project mapping
        run: |
          {
            echo "REPO=${{ steps.request.outputs.repo }}"
            echo "BRANCH=${{ steps.request.outputs.branch }}"
            echo "SUBDIR=${{ steps.request.outputs.subdir }}"
          } >> "$GITHUB_ENV"
      - name: Authorize source read
        id: reader
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BUILD_APP_ID }}
          private-key: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
          owner: ZonEaseTech
          repositories: ${{ steps.request.outputs.repo }}
          permission-contents: read
      - name: Resolve approved source
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: bash scripts/source.sh
      - name: Build and test in an isolated container
        id: compile
        run: bash scripts/build.sh
      - name: Authorize private delivery
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' }}
        id: writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BUILD_APP_ID }}
          private-key: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
          owner: ZonEaseTech
          repositories: ${{ steps.request.outputs.repo }}
          permission-contents: write
      - name: Deliver private files and verify the download
        if: ${{ !cancelled() && steps.writer.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          BUILD_STATUS: ${{ steps.compile.outcome }}
        run: bash scripts/deliver.sh
